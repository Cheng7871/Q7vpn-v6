workflows:
  q7vpn-v6-android-debug:
    name: Q7VPN V6 Android debug APK
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        ANDROID_COMPILE_SDK: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
      java: 17
    scripts:
      - name: Download & setup Android commandline tools
        script: |
          set -euo pipefail
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-mac-9477386_latest.zip -O cmdline.zip
          mkdir -p cmdline-tools
          unzip -q cmdline.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
      - name: Install Android SDK components
        script: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - name: Verify build environment
        script: |
          set -euo pipefail
          java -version
          cd android
          ./gradlew --version
      - name: Build APK
        script: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients: [2042264067@qq.com]
