
workflows:
  q7vpn-v6-android-debug:
    name: Q7VPN V6 Android debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Set Android SDK location
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"


      - name: Diagnose project files
        script: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== REPOSITORY ROOT ====="
          ls -la "$CM_BUILD_DIR"
          echo "===== ANDROID DIRECTORY ====="
          ls -la "$CM_BUILD_DIR/android" || true
          echo "===== GRADLE FILES ====="
          find "$CM_BUILD_DIR" -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) -print


      - name: Build Q7VPN Debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR/android"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - 2042264067@qq.com

