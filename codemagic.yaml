workflows:
  q7vpn-v6-android-debug:
    name: Q7VPN V6 Android debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        ANDROID_COMPILE_SDK: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
        GRADLE_VERSION: "8.9"
      java: 17

    scripts:
      - name: Verify Android project and SDK
        script: |
          set -euo pipefail

          ANDROID_DIR="$CM_BUILD_DIR/android"
          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not found (ANDROID_SDK_ROOT / ANDROID_HOME)."
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$ANDROID_DIR/local.properties"

          echo "Android project: $ANDROID_DIR"
          echo "Android SDK: $SDK_ROOT"

      - name: Install Android SDK packages and accept licenses
        script: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under Android SDK: $SDK_ROOT"
            exit 1
          fi

          # sdkmanager closes the license input pipe after reading the answers;
          # disable pipefail only for this standard yes | sdkmanager pipeline.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          test -d "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

      - name: Install pinned Gradle
        script: |
          set -euo pipefail

          GRADLE_DIR="$CM_BUILD_DIR/.codemagic-gradle"
          GRADLE_HOME="$GRADLE_DIR/gradle-${GRADLE_VERSION}"
          mkdir -p "$GRADLE_DIR"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            ZIP_PATH="$GRADLE_DIR/gradle-${GRADLE_VERSION}-bin.zip"
            curl -fL --retry 3 --connect-timeout 20 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$ZIP_PATH"
            unzip -q "$ZIP_PATH" -d "$GRADLE_DIR"
            rm -f "$ZIP_PATH"
          fi

          "$GRADLE_HOME/bin/gradle" --version

      - name: Build Q7VPN Debug APK
        script: |
          set -euo pipefail

          cd "$CM_BUILD_DIR/android"
          GRADLE_BIN="$CM_BUILD_DIR/.codemagic-gradle/gradle-${GRADLE_VERSION}/bin/gradle"
          test -x "$GRADLE_BIN"

          "$GRADLE_BIN" --no-daemon --stacktrace :app:assembleDebug

          APK="$CM_BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK created: $APK"

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - 2042264067@qq.com
