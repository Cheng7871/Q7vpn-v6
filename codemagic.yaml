workflows:
  q7vpn-v6-android-debug:
    name: Q7VPN V6 Android debug APK
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      vars:
        ANDROID_COMPILE_SDK: "35"
        ANDROID_BUILD_TOOLS: "35.0.0"
      java: 17
    scripts:
      - name: 配置Android SDK PATH
        script: |
          set -euo pipefail
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
      - name: Install Android SDK components
        script: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
      - name: Verify build environment
        script: |
          set -euo pipefail
          java -version
          ./android/gradlew --version
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
      - name: Build APK
        script: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients: [2042264067@qq.com]
