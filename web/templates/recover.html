<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q7vpn · 找回密码</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><script>try{document.documentElement.dataset.theme=localStorage.getItem('q7theme')||'dark'}catch(e){}</script></head><body><main class="wrap auth-wrap"><div class="center"><div class="logo">◈</div><h1 class="brand">找回密码</h1><p class="sub">通过账户信息与安全答案重置密码</p></div>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}<form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if not question %}<input type="hidden" name="step" value="lookup"><input class="field" name="username" placeholder="注册用户名" required><input class="field" name="phone" placeholder="注册手机号" required><button class="btn">查询安全问题</button>{% else %}<input type="hidden" name="step" value="reset"><p class="small">安全问题：{{ question }}</p><input class="field" name="answer" placeholder="安全答案" required><input class="field" type="password" name="new_password" placeholder="新密码（至少 10 位）" minlength="10" required><button class="btn">重置密码</button>{% endif %}<p class="small center"><a href="{{ url_for('auth') }}">返回登录</a></p></form><p class="footer">Q7vpn · V3</p></main></body></html>
