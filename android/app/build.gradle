plugins {
    id 'com.android.application'
}

android {
    namespace 'com.q7vpn.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.q7vpn.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '6.0.0'
    }
}

dependencies {
    // sing-box Android libbox runtime. This adds the library only;
    // VPN service lifecycle and profile-to-sing-box config conversion are separate steps.
    implementation 'com.github.singbox-android:libbox:1.14.0'
}
